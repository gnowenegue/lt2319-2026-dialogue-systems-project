<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 200" width="830" height="200" style="background: transparent; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1d4ed8" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c2410c" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- 1. Microphone -->
  <rect x="30" y="70" width="160" height="60" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
  <text x="110" y="105" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">🎙️ Browser Mic</text>

  <!-- Path to Wake Word (Top) -->
  <path d="M 190 88 L 245 88 L 245 45 L 285 45" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="238" y="36" font-size="11" fill="#1d4ed8" font-weight="600" text-anchor="middle">Continuous</text>

  <!-- Path to SpeechState (Bottom) -->
  <path d="M 190 112 L 245 112 L 245 145 L 285 145" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-purple)" />
  <text x="238" y="165" font-size="11" fill="#64748b" font-weight="600" text-anchor="middle">On trigger</text>

  <!-- 2. ONNX Web: openWakeWord (Top Box) -->
  <rect x="290" y="15" width="240" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" />
  <text x="410" y="50" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">ONNX Web: openWakeWord</text>

  <!-- Trigger Connection Down -->
  <path d="M 410 75 L 410 110" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow-orange)" />
  <rect x="420" y="81" width="115" height="22" rx="4" fill="#ffedd5" stroke="#c2410c" />
  <text x="477" y="96" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">"Hey Chef" Trigger</text>

  <!-- 3. SpeechState Extended (Bottom Box) -->
  <rect x="290" y="115" width="240" height="60" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5" />
  <text x="410" y="150" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">SpeechState (Extended)</text>

  <!-- Path to Azure Cloud ASR -->
  <path d="M 530 145 L 615 145" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)" />
  <text x="572" y="137" font-size="11" fill="#7c3aed" font-weight="600" text-anchor="middle">Audio Stream</text>

  <!-- 4. Azure Cloud ASR -->
  <rect x="620" y="115" width="180" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text x="710" y="150" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Azure Cloud ASR</text>
</svg>